<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>可愛動物設計遊戲 - 動物圖鑑</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- 導覽列 -->
    <nav class="navbar">
        <div class="logo">🐾 動物設計坊</div>
        <ul class="nav-links">
            <li><a href="index.html">首頁</a></li>
            <li><a href="products.html" class="active">動物圖鑑</a></li>
            <li><a href="contact.html">聯絡我們</a></li>
        </ul>
    </nav>

    <!-- 產品介紹主要內容 -->
    <main class="products-page">
        <h1>探索動物角色</h1>
        <p>點擊下方可愛的動物，看看他們的小秘密！</p>

        <div class="animal-grid">
            <!-- 貓咪 -->
            <div class="animal-card" onclick="showAnimalInfo('cat')">
                <svg class="animal-svg" viewBox="0 0 200 200">
                    <polygon points="60,70 50,25 95,50" fill="#ffb7b2"/>
                    <polygon points="140,70 150,25 105,50" fill="#ffb7b2"/>
                    <polygon points="63,65 57,38 88,53" fill="#ff9a9e"/>
                    <polygon points="137,65 143,38 112,53" fill="#ff9a9e"/>
                    <circle cx="100" cy="105" r="60" fill="#ffd6d3"/>
                    <circle cx="78" cy="95" r="10" fill="#333"/>
                    <circle cx="122" cy="95" r="10" fill="#333"/>
                    <circle cx="81" cy="91" r="3.5" fill="#fff"/>
                    <circle cx="125" cy="91" r="3.5" fill="#fff"/>
                    <polygon points="100,112 94,118 106,118" fill="#ff7b81"/>
                    <path d="M100 118 Q92 128 84 120" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M100 118 Q108 128 116 120" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <line x1="55" y1="108" x2="80" y2="112" stroke="#333" stroke-width="2"/>
                    <line x1="55" y1="120" x2="80" y2="120" stroke="#333" stroke-width="2"/>
                    <line x1="145" y1="108" x2="120" y2="112" stroke="#333" stroke-width="2"/>
                    <line x1="145" y1="120" x2="120" y2="120" stroke="#333" stroke-width="2"/>
                    <circle cx="68" cy="115" r="7" fill="#ffb7b2" opacity="0.7"/>
                    <circle cx="132" cy="115" r="7" fill="#ffb7b2" opacity="0.7"/>
                </svg>
                <h3>喵喵</h3>
            </div>

            <!-- 狗狗 -->
            <div class="animal-card" onclick="showAnimalInfo('dog')">
                <svg class="animal-svg" viewBox="0 0 200 200">
                    <ellipse cx="52" cy="90" rx="22" ry="42" fill="#c98a4b" transform="rotate(-15 52 90)"/>
                    <ellipse cx="148" cy="90" rx="22" ry="42" fill="#c98a4b" transform="rotate(15 148 90)"/>
                    <circle cx="100" cy="105" r="62" fill="#e8b57a"/>
                    <ellipse cx="100" cy="130" rx="36" ry="26" fill="#fff3e0"/>
                    <circle cx="76" cy="95" r="10" fill="#333"/>
                    <circle cx="124" cy="95" r="10" fill="#333"/>
                    <circle cx="79" cy="91" r="3.5" fill="#fff"/>
                    <circle cx="127" cy="91" r="3.5" fill="#fff"/>
                    <ellipse cx="100" cy="118" rx="10" ry="7" fill="#333"/>
                    <path d="M100 125 L100 134" stroke="#333" stroke-width="3"/>
                    <path d="M100 134 Q90 142 82 134" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M100 134 Q110 142 118 134" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <ellipse cx="100" cy="140" rx="8" ry="10" fill="#ff8fa3"/>
                    <circle cx="64" cy="118" r="8" fill="#ffb7b2" opacity="0.7"/>
                    <circle cx="136" cy="118" r="8" fill="#ffb7b2" opacity="0.7"/>
                </svg>
                <h3>旺財</h3>
            </div>

            <!-- 小鳥 -->
            <div class="animal-card" onclick="showAnimalInfo('bird')">
                <svg class="animal-svg" viewBox="0 0 200 200">
                    <ellipse cx="100" cy="115" rx="60" ry="58" fill="#a0c4ff"/>
                    <ellipse cx="100" cy="135" rx="38" ry="34" fill="#e6f0ff"/>
                    <ellipse cx="48" cy="120" rx="20" ry="34" fill="#7ea8f0" transform="rotate(20 48 120)"/>
                    <ellipse cx="152" cy="120" rx="20" ry="34" fill="#7ea8f0" transform="rotate(-20 152 120)"/>
                    <path d="M92 60 Q100 40 112 62" fill="#a0c4ff"/>
                    <circle cx="80" cy="100" r="11" fill="#333"/>
                    <circle cx="120" cy="100" r="11" fill="#333"/>
                    <circle cx="83" cy="96" r="4" fill="#fff"/>
                    <circle cx="123" cy="96" r="4" fill="#fff"/>
                    <polygon points="100,112 88,124 112,124" fill="#ffb84d"/>
                    <circle cx="66" cy="118" r="8" fill="#ffb7b2" opacity="0.8"/>
                    <circle cx="134" cy="118" r="8" fill="#ffb7b2" opacity="0.8"/>
                    <path d="M85 168 L85 180 M75 180 L95 180" stroke="#ffb84d" stroke-width="4" stroke-linecap="round"/>
                    <path d="M115 168 L115 180 M105 180 L125 180" stroke="#ffb84d" stroke-width="4" stroke-linecap="round"/>
                </svg>
                <h3>小藍</h3>
            </div>

            <!-- 熊貓 -->
            <div class="animal-card" onclick="showAnimalInfo('panda')">
                <svg class="animal-svg" viewBox="0 0 200 200">
                    <circle cx="60" cy="60" r="25" fill="#333"/>
                    <circle cx="140" cy="60" r="25" fill="#333"/>
                    <circle cx="100" cy="105" r="65" fill="#fff"/>
                    <ellipse cx="70" cy="95" rx="15" ry="20" fill="#333" transform="rotate(-30 70 95)"/>
                    <ellipse cx="130" cy="95" rx="15" ry="20" fill="#333" transform="rotate(30 130 95)"/>
                    <circle cx="70" cy="95" r="5" fill="#fff"/>
                    <circle cx="130" cy="95" r="5" fill="#fff"/>
                    <ellipse cx="100" cy="120" rx="10" ry="7" fill="#333"/>
                    <path d="M100 127 Q85 140 75 130" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M100 127 Q115 140 125 130" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <circle cx="55" cy="125" r="10" fill="#ffb7b2" opacity="0.6"/>
                    <circle cx="145" cy="125" r="10" fill="#ffb7b2" opacity="0.6"/>
                </svg>
                <h3>圓仔</h3>
            </div>

            <!-- 青蛙 -->
            <div class="animal-card" onclick="showAnimalInfo('frog')">
                <svg class="animal-svg" viewBox="0 0 200 200">
                    <circle cx="60" cy="70" r="30" fill="#8fd14f"/>
                    <circle cx="140" cy="70" r="30" fill="#8fd14f"/>
                    <circle cx="60" cy="70" r="18" fill="#fff"/>
                    <circle cx="140" cy="70" r="18" fill="#fff"/>
                    <circle cx="60" cy="70" r="8" fill="#333"/>
                    <circle cx="140" cy="70" r="8" fill="#333"/>
                    <ellipse cx="100" cy="130" rx="70" ry="55" fill="#8fd14f"/>
                    <path d="M70 130 Q100 160 130 130" stroke="#333" stroke-width="4" fill="none" stroke-linecap="round"/>
                    <circle cx="45" cy="125" r="10" fill="#ffb7b2" opacity="0.8"/>
                    <circle cx="155" cy="125" r="10" fill="#ffb7b2" opacity="0.8"/>
                </svg>
                <h3>呱呱</h3>
            </div>

            <!-- 狐狸 -->
            <div class="animal-card" onclick="showAnimalInfo('fox')">
                <svg class="animal-svg" viewBox="0 0 200 200">
                    <polygon points="40,80 60,20 100,60" fill="#ff8c42"/>
                    <polygon points="160,80 140,20 100,60" fill="#ff8c42"/>
                    <polygon points="55,75 65,35 90,60" fill="#fff3e0"/>
                    <polygon points="145,75 135,35 110,60" fill="#fff3e0"/>
                    <circle cx="100" cy="110" r="60" fill="#ff8c42"/>
                    <ellipse cx="100" cy="135" rx="40" ry="30" fill="#fff3e0"/>
                    <circle cx="75" cy="100" r="10" fill="#333"/>
                    <circle cx="125" cy="100" r="10" fill="#333"/>
                    <circle cx="78" cy="96" r="3.5" fill="#fff"/>
                    <circle cx="128" cy="96" r="3.5" fill="#fff"/>
                    <ellipse cx="100" cy="125" rx="8" ry="6" fill="#333"/>
                    <path d="M100 131 Q90 140 80 132" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                    <path d="M100 131 Q110 140 120 132" stroke="#333" stroke-width="3" fill="none" stroke-linecap="round"/>
                </svg>
                <h3>阿狐</h3>
            </div>
        </div>

        <!-- 動物資訊顯示區域 -->
        <div id="animalInfoDisplay" class="info-display">
            <p>👆 請點擊上方任一動物卡片！</p>
        </div>
    </main>

    <footer>
        <p>&copy; 2024 可愛動物設計坊. All rights reserved.</p>
    </footer>

    <script src="script.js"></script>
</body>
</html>
